name: Build iPhone IPA
run-name: "Diastomy iPhone - ${{ inputs.build_token || 'manual' }}"
'on':
  workflow_dispatch:
    inputs:
      build_token:
        description: "Builder request ID"
        type: string
        required: false
        default: manual
permissions:
  contents: read
concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build unsigned device IPA
        run: bash scripts/build-ipa.sh
      - name: Downloadable IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Diastomy-iPhone-IPA
          path: |
            output/Diastomy-unsigned.ipa
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
