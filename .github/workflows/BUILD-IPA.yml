name: Build iPhone IPA
run-name: "Diastomy iPhone - ${{ inputs.build_token || 'manual' }}"
'on':
  workflow_dispatch:
    inputs:
      test_startup:
        description: Run the iOS Simulator startup test before packaging
        type: boolean
        default: false
      build_token:
        description: "Builder request ID"
        type: string
        required: false
        default: manual
permissions:
  contents: read
concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate bundled interface
        run: |
          python3 scripts/validate_offline.py
          python3 tests/test_startup_report.py
          node --check Diastomy/Web/app.js
      - name: Build unsigned device IPA
        env:
          DIASTOMY_TEST_STARTUP: ${{ inputs.test_startup }}
        run: bash scripts/build-ipa.sh
      - name: Startup diagnostics
        if: ${{ always() && inputs.test_startup }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Diastomy-startup-diagnostics
          path: output/startup-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Downloadable IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Diastomy-iPhone-IPA
          path: |
            output/Diastomy-unsigned.ipa
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
